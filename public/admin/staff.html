<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Approvals</title>
  <link rel="stylesheet" href="/css/admin-dashboard.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Inventory Admin</div>
      <nav>
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/categories.html">Categories</a>
        <a href="/admin/products.html">Products</a>
        <a href="/admin/orders.html">Orders</a>
        <a class="active" href="/admin/staff.html">Staff</a>
        <a href="/login.html">Logout</a>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <p class="eyebrow">Team</p>
          <h1>Staff approvals</h1>
        </div>
        <a class="ghost" href="/register.html">Invite new staff</a>
      </header>

      <section class="panel">
        <h3>Pending requests</h3>
        <div class="button-row">
          <button class="ghost-button" data-filter="pending">Pending</button>
          <button class="ghost-button" data-filter="active">Active</button>
          <button class="ghost-button" data-filter="rejected">Rejected</button>
          <button class="ghost-button" data-filter="terminated">Terminated</button>
        </div>
        <div id="staffList" class="list" style="margin-top:12px;"></div>
      </section>
    </main>
  </div>

  <script>
    const staffList = document.getElementById('staffList');
    const filterButtons = document.querySelectorAll('[data-filter]');
    let currentFilter = 'pending';
    const defaultFilterBtn = document.querySelector('[data-filter="pending"]');
    if (defaultFilterBtn) defaultFilterBtn.classList.add('active');

    filterButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        filterButtons.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        loadStaff();
      });
    });

    function render(list) {
      if (!list.length) {
      staffList.innerHTML = '<p class="muted">No records.</p>';
      return;
    }
    staffList.innerHTML = list
      .map((s) => {
        const status = s.status || 'pending';
        const actions =
          status === 'pending'
            ? `<div class="button-row">
                  <button class="primary" data-action="approve" data-id="${s.id}">Approve</button>
                  <button class="ghost-button danger" data-action="reject" data-id="${s.id}">Reject</button>
                </div>`
              : status === 'active'
              ? `<div class="button-row">
                  <button class="ghost-button danger" data-action="terminate" data-id="${s.id}">Terminate</button>
                </div>`
              : '';
        return `
          <div class="list-item">
            <div class="list-header">
              <div>
                <p class="label">${s.name}</p>
                  <p class="muted">${s.phone_number}</p>
                  <p class="badge">Status: ${status}</p>
                </div>
              </div>
              ${actions}
            </div>
          `;
        })
        .join('');
    }

    async function loadStaff() {
      staffList.innerHTML = '<p class="muted">Loading...</p>';
      try {
        const resp = await fetch(`/api/admin/staff?status=${currentFilter}`);
        if (resp.status === 401) {
          window.location.href = '/login.html';
          return;
        }
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Failed to load staff');
        render(data.items || []);
      } catch (err) {
        staffList.innerHTML = `<p class="error">${err.message}</p>`;
      }
    }

    staffList.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      if (action === 'terminate') {
        const confirmed = confirm('Are you sure you want to terminate this staff member?');
        if (!confirmed) return;
      }
      const originalText = btn.textContent;
      btn.textContent = action === 'approve' ? 'Approving...' : action === 'reject' ? 'Rejecting...' : 'Terminating...';
      try {
        const resp = await fetch(`/api/admin/staff/${id}/${action}`, { method: 'PATCH' });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Failed');
        await loadStaff();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.textContent = originalText;
      }
    });

    loadStaff();
  </script>
</body>
</html>
