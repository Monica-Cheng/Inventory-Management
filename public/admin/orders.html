<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Orders</title>
  <link rel="stylesheet" href="/css/admin-dashboard.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Inventory Admin</div>
      <nav>
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/categories.html">Categories</a>
        <a href="/admin/products.html">Products</a>
        <a class="active" href="/admin/orders.html">Orders</a>
        <a href="/admin/staff.html">Staff</a>
        <a href="/login.html">Logout</a>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <p class="eyebrow">Manage</p>
          <h1>Orders</h1>
        </div>
        <a class="ghost" href="/admin/dashboard.html">Back to dashboard</a>
      </header>

      <section class="panel">
        <h3>Create order</h3>
        <form id="orderForm" class="form">
          <div class="field-row">
            <div class="floating" style="padding: 12px 0;">
              <p class="label" style="margin:0;">Operator</p>
              <p class="muted" style="margin:4px 0 0;">Current admin (stored as null)</p>
            </div>
            <label class="floating">
              <span>Order date (optional)</span>
              <input type="datetime-local" name="order_date" id="orderDate" placeholder=" " />
            </label>
          </div>

          <div id="itemsContainer" class="list" style="margin-bottom: 12px;"></div>

          <div class="button-row">
            <button type="button" class="ghost-button" id="addItemBtn">+ Add item</button>
            <button type="submit" class="primary">Create order</button>
          </div>

          <p id="formHint" class="muted"></p>
          <p id="status" class="muted"></p>
        </form>
      </section>

      <section class="panel">
        <h3>Recent orders</h3>
        <div id="ordersList" class="list"></div>
      </section>
    </main>
  </div>

  <script>
    const orderForm = document.getElementById('orderForm');
    const orderDate = document.getElementById('orderDate');
    const itemsContainer = document.getElementById('itemsContainer');
    const addItemBtn = document.getElementById('addItemBtn');
    const statusEl = document.getElementById('status');
    const formHint = document.getElementById('formHint');
    const ordersList = document.getElementById('ordersList');

    let products = [];
    let staff = [];
    let orders = [];

    function optionLabelForProduct(p) {
      return `${p.name} — stock: ${p.quantity}`;
    }

    function productOptionsHtml() {
      if (!products.length) {
        return '<option value="">No products</option>';
      }
      return ['<option value="" selected disabled>Select product</option>']
        .concat(products.map((p) => `<option value="${p.id}">${optionLabelForProduct(p)}</option>`))
        .join('');
    }

    function addItemRow() {
      const row = document.createElement('div');
      row.className = 'list-item';
      row.innerHTML = `
        <div class="field-row" style="align-items:flex-end">
          <label class="floating">
            <span>Product</span>
            <select required class="product-select">
              ${productOptionsHtml()}
            </select>
          </label>
          <label class="floating">
            <span>Quantity</span>
            <input type="number" min="1" value="1" required class="qty-input" placeholder=" ">
          </label>
          <button type="button" class="ghost-button danger" data-action="remove">✕ Remove</button>
        </div>
      `;
      itemsContainer.appendChild(row);
    }

    function readItems() {
      const rows = Array.from(itemsContainer.querySelectorAll('.list-item'));
      return rows
        .map((row) => {
          const productSelect = row.querySelector('.product-select');
          const qtyInput = row.querySelector('.qty-input');
          return {
            product_id: Number(productSelect.value),
            quantity: Number(qtyInput.value),
            productSelect,
            qtyInput,
          };
        })
        .filter((item) => item.product_id && item.quantity);
    }

    async function loadMeta() {
      statusEl.textContent = 'Loading data...';
      try {
        const resp = await fetch('/api/admin/orders/meta');
        if (resp.status === 401) {
          window.location.href = '/login.html';
          return;
        }
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Failed to load');
        products = data.products || [];
        staff = data.staff || [];

        itemsContainer.innerHTML = '';
        addItemRow();
        statusEl.textContent = '';
      } catch (err) {
        statusEl.textContent = err.message;
        statusEl.className = 'error';
      }
    }

    function renderOrders(list) {
      if (!list.length) {
        ordersList.innerHTML = '<p class="muted">No orders yet.</p>';
        return;
      }
      ordersList.innerHTML = list
        .map((order) => {
          const date = order.order_date ? new Date(order.order_date).toLocaleString() : 'N/A';
          const operator = order.operator_name || 'Unassigned';
          const statusLabel = order.status || 'pending';
          const itemsHtml = (order.items || [])
            .map((it) => `<li>${it.product_name || 'Product'} × ${it.quantity}</li>`)
            .join('');
          return `
            <div class="list-item">
              <div class="list-header">
                <div>
                  <p class="label">Order #${order.id}</p>
                  <p class="muted">${date}</p>
                  <p class="badge">Status: ${statusLabel}</p>
                  <p class="badge">Operator: ${operator}</p>
                </div>
              </div>
              <ul class="muted" style="margin: 8px 0 0 16px; padding: 0 0 0 12px;">
                ${itemsHtml || '<li>No items</li>'}
              </ul>
            </div>
          `;
        })
        .join('');
    }

    async function fetchOrders() {
      ordersList.innerHTML = '<p class="muted">Loading orders...</p>';
      try {
        const resp = await fetch('/api/admin/orders');
        if (resp.status === 401) {
          window.location.href = '/login.html';
          return;
        }
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Failed to load orders');
        orders = data.items || [];
        renderOrders(orders);
      } catch (err) {
        ordersList.innerHTML = `<p class="error">${err.message}</p>`;
      }
    }

    addItemBtn.addEventListener('click', () => {
      addItemRow();
    });

    itemsContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action="remove"]');
      if (!btn) return;
      const row = btn.closest('.list-item');
      if (row) {
        row.remove();
        if (!itemsContainer.children.length) addItemRow();
      }
    });

    orderForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = 'Submitting...';
      statusEl.className = 'muted';

      const items = readItems();
      if (!items.length) {
        statusEl.textContent = 'Add at least one item.';
        statusEl.className = 'error';
        return;
      }

      for (const item of items) {
        if (!item.product_id) {
          statusEl.textContent = 'Select a product for each item.';
          statusEl.className = 'error';
          return;
        }
        if (!Number.isFinite(item.quantity) || item.quantity <= 0) {
          statusEl.textContent = 'Quantity must be greater than 0.';
          statusEl.className = 'error';
          return;
        }
        const product = products.find((p) => p.id === item.product_id);
        if (product && item.quantity > product.quantity) {
          statusEl.textContent = `Not enough stock for ${product.name}. Available: ${product.quantity}`;
          statusEl.className = 'error';
          return;
        }
      }

      const payload = {
        order_date: orderDate.value ? orderDate.value : undefined,
        items: items.map((i) => ({ product_id: i.product_id, quantity: i.quantity })),
      };

      try {
        const resp = await fetch('/api/admin/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (resp.status === 401) {
          window.location.href = '/login.html';
          return;
        }
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Failed to create order');
        statusEl.textContent = `Order created (ID: ${data.orderId})`;
        statusEl.className = 'muted';
        orderForm.reset();
        itemsContainer.innerHTML = '';
        await loadMeta(); // refresh stock and options
        await fetchOrders();
      } catch (err) {
        statusEl.textContent = err.message;
        statusEl.className = 'error';
      }
    });

    loadMeta().then(fetchOrders);
  </script>
</body>
</html>
