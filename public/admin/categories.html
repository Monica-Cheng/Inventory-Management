<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Categories</title>
  <link rel="stylesheet" href="/css/admin-dashboard.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Inventory Admin</div>
      <nav>
        <a href="/admin/dashboard.html">Dashboard</a>
        <a class="active" href="/admin/categories.html">Categories</a>
        <a href="/admin/products.html">Products</a>
        <a href="/admin/orders.html">Orders</a>
        <a href="/admin/staff.html">Staff</a>
        <a href="/login.html">Logout</a>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <p class="eyebrow">Manage</p>
          <h1>Categories</h1>
        </div>
        <a class="ghost" href="/admin/dashboard.html">Back to dashboard</a>
      </header>

      <section class="panel">
        <h3>Create category</h3>
        <form id="categoryForm" class="form">
          <div class="field-row">
            <label class="floating">
              <span>Name</span>
              <input type="text" name="name" placeholder="Category name" required>
            </label>
            <label class="floating">
              <span>Description</span>
              <input type="text" name="description" placeholder="Optional description">
            </label>
          </div>
          <button type="submit" class="primary">Create</button>
          <p id="status" class="muted"></p>
        </form>
      </section>

      <section class="panel">
        <h3>Your categories</h3>
        <div id="categoriesList" class="list"></div>
        <p id="listStatus" class="muted"></p>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="categoryModal" hidden aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h3 id="modalTitle">Edit category</h3>
        <button type="button" class="ghost" id="closeModal" aria-label="Close">x</button>
      </div>
      <form id="modalForm" class="form">
        <div class="field-row">
          <label class="floating">
            <span>Name</span>
            <input type="text" id="modalName" placeholder="Category name" required>
          </label>
          <label class="floating">
            <span>Description</span>
            <input type="text" id="modalDescription" placeholder="Optional description">
          </label>
        </div>
        <p id="modalStatus" class="muted"></p>
        <div class="button-row">
          <button type="submit" class="primary">Save changes</button>
          <button type="button" class="ghost danger" id="modalDelete">Delete</button>
          <button type="button" class="ghost" id="modalCancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop confirm" id="confirmModal" hidden aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="modal-header">
        <h3 id="confirmTitle">Confirm action</h3>
      </div>
      <p id="confirmMessage" class="muted"></p>
      <div class="button-row">
        <button type="button" class="ghost" id="confirmCancel">Cancel</button>
        <button type="button" class="primary" id="confirmYes">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('categoryForm');
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('categoriesList');
    const listStatusEl = document.getElementById('listStatus');
    const modal = document.getElementById('categoryModal');
    const modalForm = document.getElementById('modalForm');
    const modalName = document.getElementById('modalName');
    const modalDescription = document.getElementById('modalDescription');
    const modalStatus = document.getElementById('modalStatus');
    const modalDelete = document.getElementById('modalDelete');
    const modalCancel = document.getElementById('modalCancel');
    const closeModalBtn = document.getElementById('closeModal');
    const confirmModal = document.getElementById('confirmModal');
    const confirmMessage = document.getElementById('confirmMessage');
    const confirmYes = document.getElementById('confirmYes');
    const confirmCancel = document.getElementById('confirmCancel');
    let pendingConfirm = null;
    let editingId = null;
    modal.hidden = true;
    modal.classList.remove('show');

    function setListStatus(message, type = 'muted') {
      listStatusEl.textContent = message || '';
      listStatusEl.className = type === 'success' ? 'success' : type;
    }

    async function parseJsonSafe(resp) {
      const ctype = resp.headers.get('content-type') || '';
      if (ctype.includes('application/json')) {
        try {
          return await resp.json();
        } catch (_) {
          return null;
        }
      }
      return null;
    }

    async function handleResponse(resp, defaultMessage) {
      const data = await parseJsonSafe(resp);
      if (!resp.ok) {
        const message = (data && data.error) || defaultMessage || `Request failed (${resp.status})`;
        throw new Error(message);
      }
      if (!data) {
        throw new Error(defaultMessage || 'Server returned an unexpected response');
      }
      return data;
    }

    async function fetchCategories(clearStatus = true) {
      listEl.innerHTML = '<p class="muted">Loading...</p>';
      if (clearStatus) setListStatus('');
      try {
        const resp = await fetch('/api/admin/categories');
        const data = await handleResponse(resp, 'Failed to load categories');
        if (!data.items.length) {
          listEl.innerHTML = '<p class="muted">No categories yet.</p>';
          return;
        }
        listEl.innerHTML = data.items
          .map(
            (c) => `
              <div class="list-item" data-id="${c.id}">
                <div>
                  <p class="label">${c.name}</p>
                  <p class="muted">${c.description || 'No description'}</p>
                </div>
                <div class="actions">
                  <button type="button" class="ghost" data-action="edit">Edit</button>
                  <button type="button" class="ghost danger" data-action="delete">Delete</button>
                </div>
              </div>
            `
          )
          .join('');

        listEl.querySelectorAll('[data-action="edit"]').forEach((btn) => {
          btn.addEventListener('click', () => openEditModal(btn.closest('.list-item')));
        });
        listEl.querySelectorAll('[data-action="delete"]').forEach((btn) => {
          btn.addEventListener('click', () => openDeleteModal(btn.closest('.list-item')));
        });
      } catch (err) {
        listEl.innerHTML = `<p class="error">${err.message}</p>`;
      }
    }

    function showModal() {
      modal.hidden = false;
      modal.classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function hideModal() {
      modal.classList.remove('show');
      modal.hidden = true;
      document.body.style.overflow = '';
    }

    function openEditModal(itemEl) {
      editingId = itemEl.dataset.id;
      const nameEl = itemEl.querySelector('.label');
      const descEl = itemEl.querySelector('.muted');
      modalName.value = nameEl.textContent;
      modalDescription.value = descEl.textContent === 'No description' ? '' : descEl.textContent;
      modalStatus.textContent = '';
      modalStatus.className = 'muted';
      showModal();
    }

    function openDeleteModal(itemEl) {
      editingId = itemEl.dataset.id;
      const nameEl = itemEl.querySelector('.label').textContent;
      modalName.value = nameEl;
      modalDescription.value = '';
      modalStatus.textContent = `Delete category "${nameEl}"? This cannot be undone.`;
      modalStatus.className = 'error';
      showModal();
    }

    function closeModal() {
      editingId = null;
      hideModal();
      modalStatus.textContent = '';
      modalStatus.className = 'muted';
      modalForm.reset();
    }

    function openConfirm(message, onConfirm) {
      confirmMessage.textContent = message;
      pendingConfirm = onConfirm;
      confirmModal.hidden = false;
      confirmModal.classList.add('show');
    }

    function closeConfirm() {
      confirmModal.classList.remove('show');
      confirmModal.hidden = true;
      pendingConfirm = null;
    }

    modalForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!editingId) return;
      const name = modalName.value.trim();
      const description = modalDescription.value.trim();
      if (!name) {
        modalStatus.textContent = 'Name is required';
        modalStatus.className = 'error';
        return;
      }
      const performUpdate = async () => {
        modalStatus.textContent = 'Saving...';
        modalStatus.className = 'muted';
        try {
          const resp = await fetch(`/api/admin/categories/${editingId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, description: description || null }),
          });
          await handleResponse(resp, 'Failed to update category');
          modalStatus.textContent = 'Updated';
          closeModal();
          setListStatus('Category updated', 'success');
          fetchCategories(false);
        } catch (err) {
          modalStatus.textContent = err.message;
          modalStatus.className = 'error';
        }
      };
      openConfirm(`Save changes to "${name}"?`, performUpdate);
    });

    modalDelete.addEventListener('click', () => {
      if (!editingId) return;
      const name = modalName.value.trim();
      const performDelete = async () => {
        modalStatus.textContent = 'Deleting...';
        modalStatus.className = 'muted';
        try {
          const resp = await fetch(`/api/admin/categories/${editingId}`, { method: 'DELETE' });
          await handleResponse(resp, 'Failed to delete category');
          modalStatus.textContent = 'Deleted';
          closeModal();
          setListStatus('Category deleted', 'success');
          fetchCategories(false);
        } catch (err) {
          modalStatus.textContent = err.message;
          modalStatus.className = 'error';
        }
      };
      openConfirm(`Delete category "${name}"? This cannot be undone.`, performDelete);
    });

    modalCancel.addEventListener('click', closeModal);
    closeModalBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    confirmYes.addEventListener('click', async () => {
      const action = pendingConfirm;
      closeConfirm();
      if (action) await action();
    });

    confirmCancel.addEventListener('click', closeConfirm);
    confirmModal.addEventListener('click', (e) => {
      if (e.target === confirmModal) closeConfirm();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modal.hidden) closeModal();
      if (e.key === 'Escape' && !confirmModal.hidden) closeConfirm();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = 'Creating...';
      statusEl.className = 'muted';
      try {
        const payload = {
          name: form.name.value.trim(),
          description: form.description.value.trim(),
        };
        const resp = await fetch('/api/admin/categories', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        await handleResponse(resp, 'Failed to create');
        statusEl.textContent = 'Created!';
        form.reset();
        setListStatus('Category created', 'success');
        fetchCategories(false);
      } catch (err) {
        statusEl.textContent = err.message;
        statusEl.className = 'error';
      }
    });

    fetchCategories(true);
  </script>
</body>
</html>
