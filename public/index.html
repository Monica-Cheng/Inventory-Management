<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Dashboard</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="shell">
        <header>
            <!-- Inventory inspiration strip -->
            <div class="image-strip">
                <img src="https://images.unsplash.com/photo-1515168833906-d2a3b82b302a?auto=format&fit=crop&w=400&q=80" alt="Inventory shelves">
                <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad?auto=format&fit=crop&w=400&q=80" alt="Stock management">
                <img src="https://images.unsplash.com/photo-1506629082955-511b1aa562c8?auto=format&fit=crop&w=400&q=80" alt="Boxes in warehouse">
            </div>
            <div>
                <h1>Personalize and Orchestrate Your Inventory</h1>
                <!-- Centered onboarding CTAs -->
                <div class="cta-group">
                    <a class="cta-button primary" href="/login.html">Start now</a>
                    <button class="cta-button support" type="button">Customer support</button>
                    <button class="cta-button ghost" type="button">Request a demo</button>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
